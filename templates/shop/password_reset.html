<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازیابی رمز عبور • اینستاگرام</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/misc/Farsi-Digits/font-face.css" rel="stylesheet" type="text/css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn FD', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #000000;
            color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .auth-box {
            background-color: #121212;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 32px 40px;
            text-align: center;
        }

        .lock-icon {
            font-size: 3rem;
            margin-bottom: 14px;
        }

        .title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #a8a8a8;
            font-size: 0.85rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .alert-box {
            background-color: rgba(237, 73, 86, 0.15);
            color: #ed4956;
            border: 1px solid #ed4956;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.82rem;
            margin-bottom: 16px;
            text-align: right;
        }

        .input-group {
            margin-bottom: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 11px 12px;
            background: #1a1a1a;
            border: 1px solid #363636;
            border-radius: 4px;
            color: #fafafa;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #737373;
        }

        .btn-submit {
            width: 100%;
            padding: 9px;
            background-color: #0095f6;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #1877f2;
        }

        .switch-box {
            background-color: #121212;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 16px;
            text-align: center;
            font-size: 0.88rem;
        }

        .switch-box a {
            color: #f5f5f5;
            text-decoration: none;
            font-weight: 600;
        }

        .switch-box a:hover {
            color: #0095f6;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-box">
            <div class="lock-icon">🔒</div>
            <h2 class="title">مشکل در ورود دارید؟</h2>
            <p class="subtitle">ایمیل ثبت‌شده در حسابتان را وارد کنید تا پیوند بازنشانی برای شما ارسال شود.</p>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert-box">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="POST" action="{% url 'shop:password_reset' %}">
                {% csrf_token %}
                <div class="input-group">
                    <input type="email" name="email" placeholder="آدرس ایمیل" required autocomplete="email">
                </div>
                <button type="submit" class="btn-submit">ارسال پیوند ورود</button>
            </form>
        </div>

        <div class="switch-box">
            <a href="{% url 'shop:login' %}">بازگشت به صفحه ورود</a>
        </div>
    </div>

</body>
</html>
