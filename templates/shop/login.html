<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود • اینستاگرام</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/misc/Farsi-Digits/font-face.css" rel="stylesheet" type="text/css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn FD', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #000000;
            color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .auth-box {
            background-color: #121212;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 35px 40px;
            text-align: center;
        }

        .brand-logo {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 28px;
            color: #ffffff;
            font-family: sans-serif;
        }

        .alert-box {
            background-color: rgba(237, 73, 86, 0.15);
            color: #ed4956;
            border: 1px solid #ed4956;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .input-group {
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 10px 12px;
            background: #1a1a1a;
            border: 1px solid #363636;
            border-radius: 4px;
            color: #fafafa;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #737373;
        }

        .btn-submit {
            width: 100%;
            padding: 9px;
            margin-top: 10px;
            background-color: #0095f6;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #1877f2;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: #737373;
            font-size: 0.8rem;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid #262626;
        }

        .divider span {
            padding: 0 14px;
        }

        .link-forgot {
            display: inline-block;
            color: #e0f1ff;
            font-size: 0.8rem;
            text-decoration: none;
            margin-top: 8px;
        }

        .switch-box {
            background-color: #121212;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 20px;
            text-align: center;
            font-size: 0.88rem;
        }

        .switch-box a {
            color: #0095f6;
            text-decoration: none;
            font-weight: 600;
            margin-right: 4px;
        }

        .footer-note {
            text-align: center;
            font-size: 0.75rem;
            color: #737373;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <!-- کادر اصلی ورود -->
        <div class="auth-box">
            <h1 class="brand-logo">Instagram</h1>

            <!-- کادر نمونه برای خطا (استایل پیش‌فرض) -->
            <div class="alert-box">
                {% if messages %}
                    {% for message  in messages  %}
                    <p class="alert alert-{{ message.tags }}">{{ message }}</p>
                    {% endfor %}
                {% endif %}
            </div>

            <form method="POST" action="{% url 'shop:login' %}">
                {% csrf_token %}
                <div class="input-group">
                    <input type="text" name="username" placeholder="شماره همراه، نام کاربری یا ایمیل" required>
                </div>

                <div class="input-group">
                    <input type="password" name="password" placeholder="گذرواژه" required>
                </div>

                <button type="submit" class="btn-submit">ورود</button>
            </form>

            <div class="divider">
                <span>یا</span>
            </div>

            <a href="{% url 'shop:password_reset' %}" class="link-forgot">گذرواژه خود را فراموش کرده‌اید؟</a>
        </div>

        <!-- کادر ثبت‌نام -->
        <div class="switch-box">
            <span>حسابی ندارید؟</span>
            <a href="{% url 'shop:register' %}">ثبت‌نام کنید</a>
        </div>

        <div class="footer-note">
            از Meta
        </div>
    </div>

</body>
</html>
