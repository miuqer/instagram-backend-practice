<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام • اینستاگرام</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/misc/Farsi-Digits/font-face.css" rel="stylesheet" type="text/css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn FD', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #000000;
            color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .auth-box {
            background-color: #121212;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 30px 40px;
            text-align: center;
        }

        .brand-logo {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 12px;
            color: #ffffff;
            font-family: sans-serif;
        }

        .subtitle {
            color: #a8a8a8;
            font-size: 0.88rem;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        .alert-box {
            background-color: rgba(237, 73, 86, 0.15);
            color: #ed4956;
            border: 1px solid #ed4956;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .input-group {
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 10px 12px;
            background: #1a1a1a;
            border: 1px solid #363636;
            border-radius: 4px;
            color: #fafafa;
            font-size: 0.82rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #737373;
        }

        .terms-text {
            color: #737373;
            font-size: 0.72rem;
            line-height: 1.4;
            margin: 14px 0;
        }

        .btn-submit {
            width: 100%;
            padding: 9px;
            margin-top: 6px;
            background-color: #0095f6;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #1877f2;
        }

        .switch-box {
            background-color: #121212;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 20px;
            text-align: center;
            font-size: 0.88rem;
        }

        .switch-box a {
            color: #0095f6;
            text-decoration: none;
            font-weight: 600;
            margin-right: 4px;
        }

        .footer-note {
            text-align: center;
            font-size: 0.75rem;
            color: #737373;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <!-- کادر اصلی ثبت‌نام -->
        <div class="auth-box">
            <h1 class="brand-logo">Instagram</h1>
            <p class="subtitle">برای دیدن عکس‌ها و ویدیوهای دوستانتان ثبت‌نام کنید.</p>
            
            {% if messages %}
            <div class="alert-box">
                    {% for message in messages %}
                        <p class="alert alert-{{ message.tags }}">{{ message }}</p>
                    {% endfor %}
            </div>
            {% endif %}
            
            <form method="POST" action="{% url 'shop:register' %}">
                {% csrf_token %}
                <div class="input-group">
                    <input type="text" name="username" placeholder="نام کاربری" required>
                </div>

                <div class="input-group">
                    <input type="email" name="email" placeholder="ایمیل" required>
                </div>

                <div class="input-group">
                    <input type="tel" name="phone_number" placeholder="شماره همراه" required>
                </div>

                <div class="input-group">
                    <input type="password" name="password" placeholder="گذرواژه" required>
                </div>

                <div class="input-group">
                    <input type="password" name="confirm_password" placeholder="تکرار گذرواژه" required>
                </div>

                <p class="terms-text">
                    با ثبت‌نام، با شرایط، خط‌مشی رازداری و خط‌مشی کوکی‌های ما موافقت می‌کنید.
                </p>

                <button type="submit" class="btn-submit">ثبت‌نام</button>
            </form>
        </div>

        <!-- کادر ورود -->
        <div class="switch-box">
            <span>حساب کاربری دارید؟</span>
            <a href="{% url 'shop:login' %}">وارد شوید</a>
        </div>

        <div class="footer-note">
            از Meta
        </div>
    </div>

</body>
</html>
