<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ایمیل ارسال شد • اینستاگرام</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/misc/Farsi-Digits/font-face.css" rel="stylesheet" type="text/css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn FD', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #000000;
            color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card-box {
            background-color: #121212;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 40px 32px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .check-badge {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: rgba(34, 197, 94, 0.15);
            border: 1px solid #22c55e;
            color: #22c55e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin: 0 auto 20px auto;
        }

        h2 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        p {
            color: #a8a8a8;
            font-size: 0.88rem;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .btn-link {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #0095f6;
            color: #ffffff;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .btn-link:hover {
            background-color: #1877f2;
        }
    </style>
</head>
<body>

    <div class="card-box">
        <div class="check-badge">✓</div>
        <h2>پیوند ارسال شد</h2>
        <p>
            اگر حسابی با ایمیل واردشده مطابقت داشته باشد، پیوند تغییر گذرواژه به جیمیل شما فرستاده شد. لطفاً صندوق ورودی و بخش هرزنامه (Spam) را بررسی فرمایید.
        </p>
        <a href="{% url 'shop:login' %}" class="btn-link">بازگشت به صفحه ورود</a>
    </div>

</body>
</html>
